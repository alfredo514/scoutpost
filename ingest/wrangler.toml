#:schema node_modules/wrangler/config-schema.json
# Scoutpost ingestion worker. Standalone so a failing data pull cannot affect
# request serving, and so either side deploys without the other. See src/index.js.
#
# Deploy:  cd ingest && npx wrangler deploy
# Secret:  npx wrangler secret put INGEST_TOKEN
name = "scoutpost-ingest"
main = "src/index.js"
compatibility_date = "2026-08-01"

# TCGCSV publishes around 20:00 UTC. Run at 21:15 UTC to leave headroom, and
# again at 02:15 UTC so a transient failure gets a second chance the same night.
[triggers]
crons = ["15 21 * * *", "15 2 * * *"]

# Same database the Pages project binds to.
# The database_id is an identifier, not a secret — it grants nothing without an
# authenticated token for this account, and Cloudflare's own workflow commits it.
[[d1_databases]]
binding = "DB"
database_name = "scoutpost"
database_id = "9aa22aa8-22b8-4cf0-ba2c-6dc6e9d4b15c"

[observability]
enabled = true

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "scoutpost-images"
