<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Scoutpost">
  <!-- Original mark. Acid-lime rim and spore-pink spots on deep forest green,
       matching the palette in styles.css. Drawn to stay legible at 16px: the
       lime rim carries the silhouette, the pink spots carry the colour. -->
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4a2c"/>
      <stop offset="1" stop-color="#0c2215"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".52" r=".5">
      <stop offset="0"  stop-color="#a8f523" stop-opacity=".50"/>
      <stop offset=".6" stop-color="#a8f523" stop-opacity=".14"/>
      <stop offset="1"  stop-color="#a8f523" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#08150e"/>
  <circle cx="32" cy="33" r="27" fill="url(#halo)"/>

  <!-- spore ring at the base -->
  <ellipse cx="32" cy="51" rx="17" ry="4.6" fill="none"
           stroke="#f279e4" stroke-width="2.4" opacity=".85"/>

  <!-- stem -->
  <path d="M25 35h14v10c0 2.7-3.1 4.6-7 4.6S25 47.7 25 45z"
        fill="#123420" stroke="#a8f523" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- cap -->
  <path d="M7 34C7 19.6 18 10.5 32 10.5S57 19.6 57 34c0 2.2-1.6 3.2-4 3.2H11C8.6 37.2 7 36.2 7 34Z"
        fill="url(#cap)" stroke="#a8f523" stroke-width="3" stroke-linejoin="round"/>

  <!-- spots -->
  <circle cx="21"   cy="26.5" r="4.1" fill="#f279e4"/>
  <circle cx="34"   cy="21"   r="5"   fill="#f279e4"/>
  <circle cx="45"   cy="28.5" r="3.5" fill="#f279e4"/>
  <circle cx="28.5" cy="33"   r="2.3" fill="#f279e4" opacity=".8"/>
</svg>
