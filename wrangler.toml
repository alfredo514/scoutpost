#:schema node_modules/wrangler/config-schema.json
# Scoutpost — the site itself (Worker with static assets).
#
# Deployed by Cloudflare's git integration, which runs `npx wrangler deploy`
# from the repo root on every push to main.
#
# Two other Workers live in this repo and are deployed separately, each with
# its own config, because they do different jobs:
#   ingest/       daily cron data job (Workers can schedule; this one cannot)
#   route-worker/ serves this Worker at softsauce.co/scoutpost
name = "scoutpost"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Anything in public/ is served straight from the edge. Requests that match no
# file fall through to src/index.js.
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# Every internal link is built from BASE_PATH. To move to a dedicated domain:
# set BASE_PATH = "/", update SITE_ORIGIN, and delete the route-worker.
BASE_PATH = "/scoutpost"
SITE_ORIGIN = "https://softsauce.co"

# Same database the ingest Worker writes to.
[[d1_databases]]
binding = "DB"
database_name = "scoutpost"
database_id = "9aa22aa8-22b8-4cf0-ba2c-6dc6e9d4b15c"

[observability]
enabled = true
